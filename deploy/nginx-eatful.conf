# Merge into the existing HTTPS server block for the Eatful subdomain.
# TLS certificate management stays with the existing reverse proxy.
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16m;
    proxy_read_timeout 90s;
}

# Original files are only available through authenticated Django download routes.
location /private-media/ { return 404; }
