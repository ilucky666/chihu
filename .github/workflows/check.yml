name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eatful_test
          POSTGRES_USER: eatful
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eatful -d eatful_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: postgresql://eatful:test-only-password@127.0.0.1:5432/eatful_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock pytest==9.1.1 pytest-django==4.14.0 ruff==0.16.8
      - run: ruff check . && ruff format --check .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: pytest -q
