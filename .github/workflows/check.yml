name: checks
on:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mysql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: eatful_test
          POSTGRES_USER: eatful
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eatful -d eatful_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: eatful_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest-only-password"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_DEBUG: '1'
      DATABASE_URL: ${{ matrix.database == 'mysql' && 'mysql://root:test-only-password@127.0.0.1:3306/eatful_test' || 'postgresql://eatful:test-only-password@127.0.0.1:5432/eatful_test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - run: python -m pip install -r requirements.lock pytest==9.1.1 pytest-django==4.14.0 ruff==0.16.8
      - run: ruff check . && ruff format --check .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t chihu:ci .
      - run: bash .platform/validate.sh
        env:
          CHIHU_TEST_IMAGE: chihu:ci
