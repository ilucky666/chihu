# Optional workstation/administrator preview. The zq agent starts the same image directly.
# Database and private files are external managed services, never disposable containers.
name: ${COMPOSE_PROJECT_NAME:-chihu}
services:
  app:
    image: ${IMAGE_REF:?set an immutable image reference or a locally built preview tag}
    restart: unless-stopped
    init: true
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${EATFUL_BIND_PORT:-8000}:8000"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"
