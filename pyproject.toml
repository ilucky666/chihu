[project]
name = "eatful"
version = "0.1.0"
description = "吃乎工作台：社团美食测评协作"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "psycopg[binary]>=3.2,<3.3",
  "Pillow>=11,<13",
  "Markdown>=3.8,<4",
  "bleach>=6.2,<7",
  "openpyxl>=3.1,<4",
  "gunicorn>=23,<24",
  "whitenoise>=6.12,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.12,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
exclude = ["core/migrations"]
